[env]
_.path = [{ path = "./bin", tools = true }]


[tools]
clojure = "latest"
"github:clj-kondo/clj-kondo" = "latest"
"github:clojure-lsp/clojure-lsp" = "latest"
"github:weavejester/cljfmt" = "latest"
java = "temurin-25"
# Pin must match repos/zed/rust-toolchain.toml (see docs/ai/features/s03.md)
rust = { version = "1.97.1", profile = "minimal", targets = ["wasm32-wasip2"] }


[tasks."deps:check"]
description = "Check for outdated dependencies"
run = "./bin/deps"

[tasks."deps:upgrade"]
description = "Upgrade outdated dependencies"
run = "./bin/deps --upgrade --force"

[tasks."zed:build"]
description = "Build Zed from repos/zed (release, one-off ~30-60 min)"
dir = "repos/zed"
run = "cargo build --release -p zed"

[tasks."zed:ext:check"]
description = "Type-check the zed-extension for wasm32-wasip2"
dir = "zed-extension"
run = "cargo check --target wasm32-wasip2"

[tasks.clean]
description = "Run cleanup"
run = "./bin/clean"

[tasks.lint]
description = "Run linters"
run = "./bin/lint"

[tasks.repl]
description = "Run nREPL"
depends = ["clean"]
run = "./bin/repl"

[tasks.test]
description = "Run tests"
run = "./bin/test"

[tasks.build]
description = "Build jar"
depends = ["clean"]
run = "./bin/build"

[tasks.install]
description = "Build and install jar locally"
depends = ["build"]
run = "./bin/install"

[tasks.publish]
description = "Publish to clojars"
depends = ["build"]
run = "./bin/publish"
